<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Example Book</title><style>/* Alignment */
mtable.right-align mtd,
mtable mtd.right-align,
mtable.left-align mtd.right-align,
mtable.aligned mtd:nth-child(odd) {
  justify-items: end;
  text-align: right;
}
mtable.cases mtd,
mtable.left-align mtd,
mtable mtd.left-align,
mtable.aligned mtd:nth-child(even),
math:is(:not([display])) > mtable.multiline-equation mtd {
  justify-items: start;
  text-align: left;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.left-flush {
  padding-left: 0;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.right-flush {
  padding-right: 0;
}

/* Tables */
mtable {
  math-style: inherit;
}
mtd {
  math-depth: auto-add;
  math-style: compact;
  math-shift: compact;
}

/* Equations */
mtable.multiline-equation mtd {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
  padding: 0;
}
math > mtable.multiline-equation mtr:not(:last-child) mtd {
  padding-bottom: 0.5em;
}

/* Fractions */
mfrac {
  padding-inline: 0;
  margin-inline: 0.1em;
}

/* Accents */
mover[accent="true" i] > :first-child {
  font-feature-settings: "dtls";
}
mover.dotted[accent="true" i] > :first-child {
  font-feature-settings: "dtls" 0;
}

/* Other rules for scriptlevel, displaystyle and math-shift */
munder > :nth-child(2),
munderover > :nth-child(2) {
  math-shift: compact
}
munder[accentunder="true" i] > :not(:first-child),
mover[accent="true" i] > :not(:first-child) {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
}</style></head><body><link rel="stylesheet" href="style.css"><script>
  // Define themes array
  const themes = ['tomato', 'mocha', 'macchiato', 'frappe', 'latte'];
  
  // Get saved theme or default to Mocha
  let currentTheme = localStorage.getItem('catppuccin-theme') || 'tomato';
  
  // Apply it instantly to avoid flashing white screens
  document.documentElement.setAttribute('data-theme', currentTheme);

  // The function to cycle themes when button is clicked
  function toggleTheme() {
    let index = themes.indexOf(currentTheme);
    currentTheme = themes[(index + 1) % themes.length];
    
    document.documentElement.setAttribute('data-theme', currentTheme);
    localStorage.setItem('catppuccin-theme', currentTheme);
    
    // Update button text
    const btn = document.getElementById('theme-toggle');
    if(btn) btn.innerText = 'Theme: ' + currentTheme.charAt(0).toUpperCase() + currentTheme.slice(1);
  }

  // Hook up the button after the page loads
  window.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('theme-toggle');
    if (btn) {
        btn.innerText = 'Theme: ' + currentTheme.charAt(0).toUpperCase() + currentTheme.slice(1);
        btn.onclick = toggleTheme;
    }
  });
</script><p><button id="theme-toggle" class="theme-btn">Theme: Mocha</button></p><h1>Example Book</h1><p>This is the online version of <strong>Example Book</strong>.</p><h3 id="loc-1">Chapters</h3><ul><li><a href="chapters/introduction.html">Introduction</a></li><li><a href="chapters/accounting.html">Accounting Fundamentals</a></li><li><a href="chapters/costing.html">Introduction to Costing</a></li></ul><h3 id="loc-2">Other formats</h3><p><a href="book.pdf">Download the complete book as PDF.</a></p></body></html>
